name: Notify Site

on:
  push:
    branches: [main]
    paths: ['products.json']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.SITE_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yourname/my-site/dispatches \
            -d '{"event_type":"data-updated"}'
